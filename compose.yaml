services:
  postgres:
    image: postgres:16-alpine
    container_name: rentflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rentflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_local_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rentflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rentflow_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rentflow_backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_local_secret}@postgres:5432/${POSTGRES_DB:-rentflow_db}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000}
      AI_SERVICE_URL: http://ai:8001
      SECRET_KEY: ${SECRET_KEY:-local_docker_secret_key_min32chars_required}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health/live\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rentflow_network

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: rentflow_ai
    restart: unless-stopped
    environment:
      APP_ENV: production
      AI_PROVIDER: ${AI_PROVIDER:-mock}
    ports:
      - "${AI_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8001/health/live\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rentflow_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rentflow_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rentflow_network

volumes:
  postgres_data:
    driver: local

networks:
  rentflow_network:
    driver: bridge
