spring:
  application:
    name: rentflow-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

rentflow:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  security:
    jwt:
      secret: ${JWT_SECRET:rentflow_super_secure_jwt_secret_key_minimum_256_bits_for_hmac_sha256_algorithm_2026}
      access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXP_MINUTES:60}
      refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXP_DAYS:14}
      issuer: ${JWT_ISSUER:rentflow-api}
